unbind r
bind r source-file "$HOME/dotfiles/tmux/.tmux.conf"

set -g prefix C-space
bind C-space send-prefix
unbind C-b

# Windows
bind N previous-window
bind b split-window -h -c "#{pane_current_path}"
bind n split-window -c "#{pane_current_path}"
bind Q confirm-before -p "kill-window #W? (y/n)" kill-window
bind Space new-window -c "#{pane_current_path}"
bind Tab last-window

# Panels
set -g mode-keys vi
bind q kill-pane

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'


# ----- Style ------
source-file "$HOME/dotfiles/tmux/colors-tmux.conf"
source-file "$HOME/dotfiles/tmux/tmuxline.conf"

run '~/.tmux/plugins/tpm/tpm'
