general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(255, 255, 255, 1)

    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>
    fail_text = <i>$FAIL</i>

    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = FiraCode Nerd Font
    color = rgba(255, 255, 255, 0.95)

    halign = center
    valign = center
    position = 0, 130
}

label {
    monitor =
    text = Hi, $USER
    font_size = 22
    font_family = FiraCode Nerd Font
    color = rgba(255, 255, 255, 0.85)

    halign = center
    valign = center
    position = 0, 55
}